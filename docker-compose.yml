version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labelsure-postgres
    restart: always
    environment:
      POSTGRES_DB: labelsure_db
      POSTGRES_USER: labelsure_user
      POSTGRES_PASSWORD: labelsure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelsure_user -d labelsure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: labelsure-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  redis:
    image: redis:7-alpine
    container_name: labelsure-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: labelsure-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://labelsure_user:labelsure_password@postgres:5432/labelsure_db
      - JWT_SECRET=prod-secret-apex-labelsure-legal-metrology-2026
      - OCR_ENGINE=rapidocr
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  admin-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: labelsure-admin-web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  miniodata:
